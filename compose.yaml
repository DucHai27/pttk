name: restman5
services:
  mysql:
    image: mysql:8.4
    restart: unless-stopped
    ports:
      - "127.0.0.1:${MYSQL_PORT:-3306}:3306"
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-restman5}
      MYSQL_USER: ${MYSQL_USER:-restman}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-RestmanDev@123}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-RootDev@123}
      TZ: Asia/Bangkok
    command: ["--character-set-server=utf8mb4", "--collation-server=utf8mb4_0900_ai_ci"]
    volumes:
      - mysql_data:/var/lib/mysql
      - ./database:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "--silent"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 30s
volumes:
  mysql_data:
